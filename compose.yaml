services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jr
      POSTGRES_USER: jr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      - jr_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jr -d jr"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build: .
    command: ["node", "src/worker.js"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  jr_data:
